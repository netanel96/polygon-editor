services:
  nats:
    image: nats:2.10
    ports:
      - "4222:4222"
      - "8222:8222"

  server:
    build:
      context: ./server
    restart: unless-stopped
    expose:
      - "4000"
    environment:
      PORT: 4000
      MONGO_URL: ${MONGO_URL:-mongodb://host.docker.internal:27017/polygon-editor}
      CLIENT_URL: http://localhost:5173,http://127.0.0.1:5173,http://localhost
      NATS_URL: nats://nats:4222
      LOG_FILE_PATH: /app/logs/server.log
      LOG_OUTPUT: console,file
      LOG_TRANSPORT: local
    volumes:
      - ./server/logs:/app/logs
    depends_on:
      - nats

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    ports:
      - "80:80"
    depends_on:
      - server



